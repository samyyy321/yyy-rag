name: rag-infra

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./docker/minio:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:9000/minio/health/live || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set business http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing business/rag-documents
      "
    restart: "no"

  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    restart: unless-stopped
    command: >
      etcd
      --advertise-client-urls=http://etcd:2379
      --listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - ./docker/etcd:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 20

  milvus-minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: milvus
      MINIO_ROOT_PASSWORD: milvus-minio-password
    volumes:
      - ./docker/milvus-minio:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:9000/minio/health/live || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  milvus:
    image: milvusdb/milvus:v2.4.15
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MINIO_ACCESS_KEY_ID: milvus
      MINIO_SECRET_ACCESS_KEY: milvus-minio-password
    depends_on:
      etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - ./docker/milvus:/var/lib/milvus
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:9091/healthz"
        ]
      interval: 10s
      timeout: 5s
      retries: 30


  attu:
    image: zilliz/attu:v2.4.12
    restart: unless-stopped
    environment:
      MILVUS_URL: milvus:19530
    depends_on:
      milvus:
        condition: service_healthy
    ports:
      - "8000:3000"

    # ----------------------------------------------------------
  # Neo4j — 图数据库
  # 存储：医学知识图谱（疾病-症状-药物-科室 关系网络）
  # Web UI：http://localhost:7474  用户名/密码：neo4j/medical123
  # ----------------------------------------------------------
  neo4j:
    image: neo4j:5.20
    container_name: yyy-neo4j
    restart: always
    environment:
      NEO4J_AUTH: neo4j/medical123
      NEO4J_PLUGINS: '["apoc"]'                  # APOC 插件，支持高级图算法
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    volumes:
      - ./docker/neo4j_data:/data
      - ./docker/neo4j_logs:/logs
    ports:
      - "7474:7474"   # Web UI
      - "7687:7687"   # Bolt 协议（SDK 连接）
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 30s
      timeout: 10s
      retries: 5